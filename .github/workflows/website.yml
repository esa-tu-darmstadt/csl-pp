# Builds the documentation website, checks its links, and publishes it with
# GitHub Pages from main. The site takes its public URL from SITE_URL; its
# code examples include the csl++ libraries and use the grammar of the VS Code
# extension.

name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths: [website/**, csl-libs/**, editors/vscode/syntaxes/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SITE_URL: https://esa-tu-darmstadt.github.io/csl-pp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build and check links
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
