# Builds and publishes a release when a tag v<version> is pushed, e.g. v1.2.0
# or v1.2.0-rc.1 (1.2.0rc1 on PyPI). docs/Building.md describes the process.
#
# The build job has no credentials. The jobs after it publish what it built:
# a GitHub release with build provenance attestations, the wheel on PyPI and
# the extension on the Visual Studio Marketplace. PyPI and the Marketplace use
# trusted publishing, so no token is stored; each publishing job runs in an
# environment that requires approval.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CONAN_REMOTE_URL: https://git.esa.informatik.tu-darmstadt.de/api/v4/projects/162/packages/conan
  DOCUMENTATION_URL: https://esa-tu-darmstadt.github.io/csl-pp/

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release tag is a semantic version that is also a PEP 440 version,
      # on a commit of main.
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag $TAG must use semantic version syntax"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Release tag $TAG is not on main"; exit 1; }
          version="${TAG#v}"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r packaging/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; from packaging.version import Version; Version(sys.argv[1])' "$version" \
            || { echo "::error::Version $version is not a PEP 440 version"; exit 1; }
          # The Marketplace accepts only major.minor.patch.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      PLATFORM: rhel8-gcc15
      CSL_VERSION: ${{ needs.version.outputs.version }}
      CI_PASS_ENV: CONAN_REMOTE_URL CSL_VERSION DOCUMENTATION_URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/prepare-runner.sh
      - name: Build
        run: .github/scripts/container.sh bash .github/scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-information
          path: dist/*.tar.xz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore

  # The GitHub release keeps the wheel, the debug information of its
  # executables and the extension of every version.
  github-release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel,debug-information,vscode-extension}"
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "csl++ $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"

  pypi:
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/csl-pp/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      # Trusted publishing; the action also uploads PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # The Marketplace does not accept pre-release versions such as 1.2.0-rc.1;
  # their extension is only attached to the GitHub release.
  vscode-marketplace:
    needs: [version, github-release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=esa-tu-darmstadt.csl-lsp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing with the OpenID Connect token of this job.
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath dist/*.vsix
